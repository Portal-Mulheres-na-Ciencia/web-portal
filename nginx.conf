server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Chamadas do site para a API: o nginx repassa para o container "api" (porta 8080).
  # Assim o navegador fala com um endereço só e não precisa de CORS.
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Rotas do Angular (/cientistas, /cientista/1...): sempre devolve o index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
