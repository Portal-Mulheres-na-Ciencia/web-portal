<div class="container pagina">
  <section class="cartao">
    <p class="sobretitulo">Área da equipe</p>
    <h1 class="titulo-pagina">Entrar</h1>
    <p class="texto-apoio">Acesso só para a equipe do portal, para cadastrar cientistas e avaliar sugestões.</p>

    <form [formGroup]="formulario" (ngSubmit)="entrar()" novalidate>
      @if (erro()) {
        <p class="erro-geral" role="alert"><mat-icon aria-hidden="true">error</mat-icon>{{ erro() }}</p>
      }

      <mat-form-field appearance="outline">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="username" />
        @if (erroDe('email')) {
          <mat-error>{{ erroDe('email') }}</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>
        <input matInput type="password" formControlName="senha" autocomplete="current-password" />
        @if (erroDe('senha')) {
          <mat-error>{{ erroDe('senha') }}</mat-error>
        }
      </mat-form-field>

      <button matButton="filled" type="submit" [disabled]="enviando()">
        <mat-icon aria-hidden="true">login</mat-icon>
        {{ enviando() ? 'Entrando…' : 'Entrar' }}
      </button>
    </form>

    <a class="voltar" routerLink="/"><mat-icon aria-hidden="true">arrow_back</mat-icon>Voltar ao site</a>
  </section>
</div>
